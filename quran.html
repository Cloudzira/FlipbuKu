<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mushaf Al-Quran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./quran.css">
</head>
<body>
  <div class="judul">
    <span class="arab">المصحف الشريف</span>
    <small>Tajwid · Mushaf Madinah</small>
  </div>

  <div class="toolbar">
    <div class="segmen" role="group" aria-label="Mode tampilan">
      <button id="sTeks" class="aktif">Standar</button>
      <button id="sGambar">Tajwid</button>
    </div>
    <button id="tema" class="chip" aria-label="Ganti tema"></button>
    <div class="pilih-surah" aria-label="Pilih nama surat">
      <select id="pilihSurah" aria-label="Daftar Surah">
        <option value="" disabled selected>Pilih Surat</option>
      </select>
    </div>
    <button id="toggleGaris" class="chip aktif" aria-label="Garis antar baris">
      <svg class="ik" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="navhal" role="group" aria-label="Navigasi halaman">
      <button id="next" class="bulat" aria-label="Halaman berikutnya"><svg class="ik" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="pilih" for="halaman">
        <span>Hal.</span>
        <input type="number" id="halaman" min="1" max="604" value="1" inputmode="numeric" aria-label="Nomor halaman">
        <span>/ 604</span>
      </label>
      <button id="prev" class="bulat" aria-label="Halaman sebelumnya"><svg class="ik" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <div id="wrap">
    <div class="frame" id="frame">
      <div class="edge e-top"></div><div class="edge e-bottom"></div>
      <div class="edge e-left"></div><div class="edge e-right"></div>
      <svg class="corner c1" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 28 Q2 2 28 2"/><path d="M2 2 H12 M2 2 V12"/><circle cx="9" cy="9" r="2.6" fill="currentColor" stroke="none"/></svg>
      <svg class="corner c2" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 28 Q2 2 28 2"/><path d="M2 2 H12 M2 2 V12"/><circle cx="9" cy="9" r="2.6" fill="currentColor" stroke="none"/></svg>
      <svg class="corner c3" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 28 Q2 2 28 2"/><path d="M2 2 H12 M2 2 V12"/><circle cx="9" cy="9" r="2.6" fill="currentColor" stroke="none"/></svg>
      <svg class="corner c4" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 28 Q2 2 28 2"/><path d="M2 2 H12 M2 2 V12"/><circle cx="9" cy="9" r="2.6" fill="currentColor" stroke="none"/></svg>

      <div id="kepala"><span id="kSurah"></span><span id="kJuz"></span></div>
      <div id="teks"></div>
      <div id="kaki"><span id="kNo"></span></div>
      <div id="viewport"><img id="gambar" alt="Halaman mushaf" draggable="false"></div>
    </div>
    <div id="info"></div>
    <div id="petunjuk"></div>
  </div>

  <footer id="kredit">
    <div class="hiasan"><i></i><b></b><i></i></div>
    <h2>Sumber &amp; Referensi</h2>
    <dl>
      <div>
        <dt>Mode Teks</dt>
        <dd><a href="https://github.com/MohamadHajjRabee/quran-qcf4" target="_blank" rel="noopener">quran-qcf4</a><br>Mushaf Madinah · QCF4</dd>
      </div>
      <div>
        <dt>Mode Gambar</dt>
        <dd><a href="https://github.com/SakinaDevGroup/mushaf-tajweed-cdn" target="_blank" rel="noopener">mushaf-tajweed-cdn</a><br>SakinaDevGroup</dd>
      </div>
      <div>
        <dt>Naskah &amp; Font</dt>
        <dd>King Fahd Quran<br>Printing Complex</dd>
      </div>
    </dl>
  </footer>



  <script src="./quran.js"></script>
</body>
</html>
